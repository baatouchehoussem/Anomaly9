[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly9"
version = "0.2.0"
description = "NASA MAST Data Ingestion, Detrending, Dual Detection Engine & Astrophysical Vetting Pipeline"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "lightkurve>=2.4.0",
    "astropy>=5.0.0",
    "scipy>=1.8.0",
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "scikit-learn>=1.0.0",
    "requests>=2.28.0",
    "pandas>=1.5.0",
]

[project.scripts]
anomaly9 = "anomaly9.cli:main"
anomaly9-detect = "anomaly9.main:main"
anomaly9-batch = "anomaly9.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["anomaly9*"]

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "T20"]
ignore = ["E501", "B008"]