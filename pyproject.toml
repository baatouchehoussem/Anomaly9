[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly9"
version = "0.1.0"
description = "Core NASA MAST Data Ingestion, Detrending & Dual Detection Engine"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "lightkurve>=2.4.0",
    "astropy>=5.0.0",
    "scipy>=1.8.0",
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "scikit-learn>=1.0.0",
    "requests>=2.28.0"
]

[project.scripts]
anomaly9-detect = "anomaly9.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["anomaly9*"]
